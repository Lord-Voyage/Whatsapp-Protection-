services:
  - type: web
    name: whatsapp-protection
    runtime: docker
    # Persistent disks require a paid instance type.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: OWNER_NUMBER
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: BAILEYS_LOG_LEVEL
        value: warn
    disk:
      name: whatsapp-protection-data
      mountPath: /data
      sizeGB: 1
